name: CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # Only build/deploy when something that affects the image changes;
    # keep this list in sync with build inputs (skipping it leaves prod on a stale image).
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE_REPO: agnechaev/rag-resume

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        # GHA cache export (type=gha) requires the docker-container driver,
        # which the default "docker" driver does not provide.
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push native image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_REPO }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Hetzner VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_ADDRESS }}
          username: ${{ secrets.HETZNER_USER }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          script: |
            cd app
            docker compose pull
            docker compose up -d
            docker image prune -f
            # Wait until the app serves the UI so a broken image fails the job.
            # /actuator/** requires admin basic auth, so probe the public root instead.
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/ > /dev/null; then
                echo "Application is up"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after 150s" >&2
            docker compose logs --tail=100
            exit 1
